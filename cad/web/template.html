<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arabskie gogle 3D</title>
<style>
:root {
  /* warsztatowy podgląd: ciemne pole 3D, panel części po boku (pod spodem na telefonie) */
  --bg: #15181c; --panel: #1d2127; --line: #2c323a; --text: #e6e8eb; --muted: #9aa3ad; --accent: #f2a33a;
  --font-display: "IBM Plex Mono", ui-monospace, monospace;
  --font-body: "IBM Plex Sans", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-body); }
.app { display: grid; grid-template-columns: 1fr 300px; height: 100%; }
#view { position: relative; min-height: 0; }
#view canvas { display: block; width: 100%; height: 100%; touch-action: none; }
aside { background: var(--panel); border-left: 1px solid var(--line); padding: 16px; display: flex; flex-direction: column; gap: 14px; overflow-y: auto; }
h1 { font-family: var(--font-display); font-size: 15px; font-weight: 600; margin: 0; letter-spacing: .02em; text-wrap: balance; }
.tabs { display: flex; gap: 6px; }
.tabs button, .tools button { flex: 1; font: 600 13px var(--font-body); color: var(--text); background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 8px 6px; cursor: pointer; }
.tabs button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.note { font-size: 13px; color: var(--muted); line-height: 1.45; margin: 0; }
.parts { display: flex; flex-direction: column; gap: 6px; }
.parts label { display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; }
.sw { width: 12px; height: 12px; border-radius: 3px; flex: none; }
.tools { display: flex; gap: 6px; flex-wrap: wrap; }
.hint { font-family: var(--font-display); font-size: 11px; color: var(--muted); }
#status { position: absolute; left: 16px; top: 12px; font-family: var(--font-display); font-size: 12px; color: var(--muted); }
@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; grid-template-rows: 60% 40%; }
  aside { border-left: 0; border-top: 1px solid var(--line); }
}
</style>
</head>
<body>
<div class="app">
  <div id="view"><div id="status">Ładowanie…</div></div>
  <aside>
    <h1>arabskie_gogle · podgląd 3D</h1>
    <div class="tabs" role="group" aria-label="Model" id="tabs"></div>
    <p class="note" id="note"></p>
    <div class="parts" id="parts"></div>
    <div class="tools">
      <button id="btn-reset">Widok startowy</button>
      <button id="btn-xray">Przezroczyste gogle / obudowa</button>
    </div>
    <p class="hint">obrót: przeciągnij · przybliżenie: kółko / szczypanie · przesuw: prawy przycisk / dwa palce · wymiary w mm</p>
  </aside>
</div>
<script src="lib/three.min.js"></script>
<script src="lib/STLLoader.js"></script>
<script src="lib/OrbitControls.js"></script>
<script>
const SCENES = __SCENES__;
const DATA = __DATA__;
const view = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(0x15181c);
view.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, 1, 1, 5000);
camera.up.set(0, 0, 1);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
scene.add(new THREE.HemisphereLight(0xdfe6ee, 0x30343a, 0.75));
const key = new THREE.DirectionalLight(0xffffff, 0.75); key.position.set(80, -120, 160); scene.add(key);
const rim = new THREE.DirectionalLight(0xffffff, 0.3); rim.position.set(-120, 100, 60); scene.add(rim);
const grid = new THREE.GridHelper(200, 20, 0x3a414a, 0x262b31); grid.rotation.x = Math.PI / 2; scene.add(grid);
const loader = new THREE.STLLoader();
const groups = {}; let current = 'pod'; let xray = false;

function b64ToBuf(b) { const s = atob(b); const u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u.buffer; }

function build(name) {
  const g = new THREE.Group(); g.userData.meshes = {};
  for (const [id, label, color, alpha] of SCENES[name].parts) {
    const geo = loader.parse(b64ToBuf(DATA[name + '_' + id])); geo.computeVertexNormals();
    const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.6, metalness: 0.05, transparent: alpha < 1, opacity: alpha, side: THREE.DoubleSide, depthWrite: alpha >= 1 });
    const m = new THREE.Mesh(geo, mat); m.userData.alpha = alpha; m.userData.id = id;
    g.add(m); g.userData.meshes[id] = m;
  }
  return g;
}
function frame(g) {
  const box = new THREE.Box3().setFromObject(g); const c = box.getCenter(new THREE.Vector3()); const r = box.getSize(new THREE.Vector3()).length();
  controls.target.copy(c); camera.position.set(c.x + r * 0.9, c.y - r * 1.1, c.z + r * 0.8); controls.update();
  grid.position.set(c.x, c.y, box.min.z - 0.5);
}
function show(name) {
  current = name;
  for (const k in groups) groups[k].visible = (k === name);
  if (!groups[name]) { groups[name] = build(name); scene.add(groups[name]); }
  groups[name].visible = true;
  for (const b of document.querySelectorAll('#tabs button')) b.setAttribute('aria-pressed', b.dataset.s === name);
  document.getElementById('note').textContent = SCENES[name].note;
  const list = document.getElementById('parts'); list.innerHTML = '';
  for (const [id, label, color] of SCENES[name].parts) {
    const m = groups[name].userData.meshes[id];
    const lab = document.createElement('label'); const cb = document.createElement('input');
    cb.type = 'checkbox'; cb.id = 'cb-' + name + '-' + id; cb.checked = m.visible;
    cb.addEventListener('change', () => { m.visible = cb.checked; });
    const sw = document.createElement('span'); sw.className = 'sw'; sw.style.background = color;
    lab.append(cb, sw, document.createTextNode(label)); list.append(lab);
  }
  applyXray(); frame(groups[name]);
}
function applyXray() {
  const g = groups[current]; if (!g) return;
  const shellId = current === 'pod' ? 'shell' : 'hdo2';
  const m = g.userData.meshes[shellId]; const a = xray ? (current === 'pod' ? 0.25 : 0.2) : 1;
  m.material.opacity = a; m.material.transparent = a < 1; m.material.depthWrite = a >= 1; m.material.needsUpdate = true;
  document.getElementById('btn-xray').setAttribute('aria-pressed', xray);
}
function resize() { const w = view.clientWidth, h = view.clientHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
window.addEventListener('resize', resize);
document.getElementById('btn-reset').onclick = () => frame(groups[current]);
document.getElementById('btn-xray').onclick = () => { xray = !xray; applyXray(); };
for (const k of Object.keys(SCENES)) { const b = document.createElement('button'); b.textContent = SCENES[k].tab; b.dataset.s = k; b.onclick = () => show(k); document.getElementById('tabs').append(b); }
resize(); show(Object.keys(SCENES)[0]);
document.getElementById('status').textContent = '';
(function loop() { controls.update(); renderer.render(scene, camera); requestAnimationFrame(loop); })();
</script>
</body>
</html>
