; arabskie_gogle — sterownik poda (XIAO ESP32-C3). Kompilacja: pio run ; wgranie: pio run -t upload
; Testy logiki na komputerze (bez płytki): make -C test/host
[env:xiao_c3]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
; Serial = USB-CDC, jawnie: gdyby Serial trafił na UART0, zająłby GPIO21/20 (TX kamery i bramka silnika).
; Nie sprawdzone, czy definicja płytki ustawia te flagi sama (PlatformIO nie zainstalowane, nie kompilowane).
build_flags = -std=gnu++17 -Wall -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
